version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - YOUTUBE_COOKIES_TEXT=${YOUTUBE_COOKIES_TEXT:-}
      - YOUTUBE_COOKIES_BASE64=${YOUTUBE_COOKIES_BASE64:-}
      - YOUTUBE_COOKIES_FILE=${YOUTUBE_COOKIES_FILE:-}

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s